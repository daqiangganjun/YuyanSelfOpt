name: Publish dictionaries
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'
permissions:
  contents: write
concurrency:
  group: dictionaries-v1
  cancel-in-progress: false
jobs:
  dictionaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r yuyansdk/native/requirements.txt
      - name: Build dictionary packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python yuyansdk/native/publish_dictionaries.py --latest --check-current
      - name: Publish immutable packages and index
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -f yuyansdk/build/generated/rime/release/index.json ]; then exit 0; fi
          gh release view dictionaries-v1 >/dev/null 2>&1 || gh release create dictionaries-v1 --title '语燕 SelfOpt 词库更新' --notes '白霜与按需下载的雾凇词库。由应用检查兼容性后使用。' --prerelease
          for package in yuyansdk/build/generated/rime/release/*.zip; do
            gh release upload dictionaries-v1 "$package" --clobber
          done
          gh release upload dictionaries-v1 yuyansdk/build/generated/rime/release/index.json --clobber
