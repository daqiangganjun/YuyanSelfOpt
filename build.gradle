buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.0.0'
        classpath 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.0.0-1.0.23'
    }
}

// 语义化版本单一来源，app 与 yuyansdk 共用。递增规则见 CLAUDE.md「版本号规范」
ext {
    versionMajor = 2
    versionMinor = 5
    versionPatch = 2
    appVersionName = "$versionMajor.$versionMinor.$versionPatch"
    appVersionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch
}

allprojects {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
    }
}

tasks.register('clean', Delete) {
    delete project.layout.buildDirectory
}
